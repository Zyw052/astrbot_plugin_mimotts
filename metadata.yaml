name: astrbot_plugin_mimotts
display_name: MiMo 语音合成（QQ / 微信原生语音条）
desc: |
  基于小米 MiMo-V2.5-TTS 系列模型的语音合成插件，让 Bot 真正「开口说话」。

  · 全自动发声：LLM 每条最终回复按概率自动合成语音，无需模型调用工具，零打扰接入
  · 导演手记：支持 `(温柔 撒娇)` 风格前缀与 `[轻笑]`/`[叹气]` 等动作标签，情绪细腻可导演
  · 三种音色模式：8 款内置音色 / VoiceDesign 文字捏音色 / VoiceClone 音频克隆音色
  · 双端原生语音条：NapCat、OneBot v11、QQ 官方机器人直发 RECORD 语音条；个人微信自动降级为音频文件
  · 免二次配置：自动复用 AstrBot 原生 MiMo TTS provider 的 Key 与端点
  · 防双重扣费：检测到原生 TTS 仍启用时自动让位，避免同一句话合成两次

  MiMo TTS 目前为官方限时免费服务，实际计费政策请以小米 MiMo 开放平台公告为准。
short_desc: 小米 MiMo TTS 全自动语音条，支持导演手记与音色克隆
help: |
  【自动语音（默认开启）】
    · LLM 每条最终回复会按概率自动合成语音，无需任何指令
    · 概率 / 字数区间 / 发送模式均可在插件配置中调整
    · 代码块、链接、加粗等 Markdown 会被自动清理，不会朗读出来
    · 自动复用 AstrBot 原生 MiMo TTS provider 的 Key（免二次配置）

  【指令】
    · /mimo <文本>         合成并发送语音条
    · /mimo引用            朗读被引用的消息（先引用一条文本消息）
    · /mimo音色 [名称]     查看 / 切换本会话音色（发送「重置」恢复默认）
    · /mimo风格 [风格词]   查看 / 设置本会话默认风格（发送「重置」清除）
    · /mimo状态            查看模型、Key 来源、原生 TTS 冲突、自动发声等状态
    · /mimo帮助            显示本帮助

  【文本语法（MiMo 官方协议）】
    · 风格标签必须在正文最开头：`(温柔 撒娇)你好呀`
    · 也兼容 `<style>温柔 撒娇</style>你好呀`，插件会自动转成 `(温柔 撒娇)你好呀`
      （这是 Issue #7957 的修复点：<style> 绝不能原样进正文）
    · 动作标签可插在任意位置：`你好呀[轻笑]`、`唉[叹气]`、`[吸气]我来了`
    · 风格与导演指令走 role=user（不发音），朗读正文走 role=assistant

  【音色】
    内置：冰糖、茉莉、苏打、白桦、Mia、Chloe、Milo、Dean（及别名 mimo_default）
    VoiceDesign（mimo-v2.5-tts-voicedesign）：用 voice_design_prompt 描述音色
    VoiceClone（mimo-v2.5-tts-voiceclone）：在 voice_sample_path 指定 mp3/wav 样本

  【平台说明】
    · NapCat / OneBot v11：发送 Record 语音段，框架转 base64 交给 NapCat 转 silk → 语音条
    · 个人微信（weixin_oc）：AstrBot 出站仅实现 Image/Video/File，插件先尝试适配器私有
      通道构造 voice_item（实验性），失败自动降级为 mp3 音频文件，不会丢消息
    · QQ 官方机器人等：直接发送 Record，由框架转 tencent_silk

  【重要：避免双重扣费】
    本插件与 AstrBot 原生 TTS 功能重叠。请在管理面板关闭原生 TTS，
    详见 README《如何关闭 AstrBot 原生 TTS 避免双重扣费与重合发声》。

  【依赖】
    · ffmpeg（推荐）：用于统一 24kHz/单声道、生成 mp3，缺失时直接使用 MiMo 原始 WAV
    · pysilk（可选）：启用后可自行编码 Tencent SILK，QQ 语音兼容性更好
